packages:
  - "cdktn/*"
  - "sst/*"
  - "wrangler/*"

# Shared versions. Examples reference these as `catalog:`; a dependency only one
# example uses stays pinned in that example's package.json.
catalog:
  "@biomejs/biome": ^2.5.14
  "@cloudflare/playwright": ^1.3.6
  "@cloudflare/vitest-plugin": ^1.4.0
  "@cloudflare/workers-types": ^5.20260929.1
  "@types/node": ^26.6.3
  cdktn: ^0.24.0
  cdktn-cli: ^0.24.0
  # cdktn 0.24 peers on constructs ">=10.6.0 <10.8.0"; 0.25 widens it to ^10.6.0.
  constructs: ~10.7.2
  sst: ^4.17.1
  tsx: ^4.23.15
  typescript: ^7.0.2
  vitest: ^5.0.3
  wrangler: ^4.143.1

allowBuilds:
  esbuild: true
  workerd: true
  # Neither install script produces anything the Worker bundle needs:
  # @google/genai fetches optional native helpers, protobufjs patches its own
  # CommonJS shim. Both are pulled in transitively by Stagehand.
  "@google/genai": false
  protobufjs: false
  sharp: false

overrides:
  # Clears GHSA-33vc-wfww-vjfv in the diff formatter, reached only through
  # @browserbasehq/stagehand -> ai -> jsondiffpatch. The fix is semver-compatible.
  jsondiffpatch: ">=0.7.4"

minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  # First release with the browser toolset driver class
  # (BetaAbstractBrowserToolset20260801). Drop once it is three days old.
  - "@anthropic-ai/sdk@0.132.0"
  # First release that peers on vitest 5, and the exact versions it pins.
  # Drop all of these once they are three days old (2026-10-11 18:30 UTC).
  - "@cloudflare/vitest-plugin@1.4.0"
  - "wrangler@4.149.0"
  - "miniflare@5.20261006.1-alpha"
  - "workerd@1.20261006.1"
  - "@cloudflare/workerd-darwin-64@1.20261006.1"
  - "@cloudflare/workerd-darwin-arm64@1.20261006.1"
  - "@cloudflare/workerd-linux-64@1.20261006.1"
  - "@cloudflare/workerd-linux-arm64@1.20261006.1"
  - "@cloudflare/workerd-windows-64@1.20261006.1"

# mise owns the package-manager binary.
pmOnFail: ignore
