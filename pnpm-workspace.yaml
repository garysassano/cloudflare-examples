packages:
  - "cdktn/*"
  - "sst/*"
  - "wrangler/*"

# Shared versions. Examples reference these as `catalog:`; a dependency only one
# example uses stays pinned in that example's package.json.
catalog:
  "@biomejs/biome": ^2.5.14
  "@cloudflare/playwright": ^1.3.6
  "@cloudflare/workers-types": ^5.20260919.1
  "@types/node": ^26.6.2
  cdktn: ^0.24.0
  cdktn-cli: ^0.24.0
  # cdktn 0.24 peers on constructs ">=10.6.0 <10.8.0"; 0.25 widens it to ^10.6.0.
  constructs: ~10.7.2
  sst: ^4.17.1
  tsx: ^4.23.13
  typescript: ^7.0.2
  vitest: ^5.0.1
  wrangler: ^4.135.0

catalogs:
  # @cloudflare/vitest-plugin (the Workers runtime test pool) peers on
  # vitest ^4.1.0 and has no release that supports vitest 5 yet.
  vitest4:
    "@cloudflare/vitest-plugin": ^1.1.13
    vitest: ^4.1.11

allowBuilds:
  esbuild: true
  workerd: true
  # Neither install script produces anything the Worker bundle needs:
  # @google/genai fetches optional native helpers, protobufjs patches its own
  # CommonJS shim. Both are pulled in transitively by Stagehand.
  "@google/genai": false
  protobufjs: false
  sharp: false

overrides:
  # Clears GHSA-33vc-wfww-vjfv in the diff formatter, reached only through
  # @browserbasehq/stagehand -> ai -> jsondiffpatch. The fix is semver-compatible.
  jsondiffpatch: ">=0.7.4"

minimumReleaseAge: 4320
minimumReleaseAgeStrict: true

# mise owns the package-manager binary.
pmOnFail: ignore
